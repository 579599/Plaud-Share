server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # JS / CSS 不缓存，每次确认是否更新
    location ~* \.(js|css)$ {
        add_header Cache-Control "no-cache, must-revalidate";
        expires 0;
    }

    # 其他静态资源（图片、字体等）缓存 7 天
    location ~* \.(png|jpg|jpeg|gif|svg|ico|woff|woff2)$ {
        expires 7d;
        add_header Cache-Control "public";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}